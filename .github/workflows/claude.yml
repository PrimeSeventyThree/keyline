name: Claude

# @claude in issues, comments and reviews, through the shared workflow in
# PrimeSeventyThree/github-workflows. Needs the Claude GitHub App on this repository and the
# CLAUDE_CODE_OAUTH_TOKEN secret; only people with write access can trigger it.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

jobs:
  claude:
    uses: PrimeSeventyThree/github-workflows/.github/workflows/claude.yml@v1
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
